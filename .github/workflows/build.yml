name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      oficial:
        description: "Publicar como versão oficial (vX.Y.Z)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: windows (OBS 30.0+ Universal)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { obs: "30.0.2", major: 30, runner: windows-2022, oldcmake: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin

      - name: CMake 3.30 (o código do OBS 30 não aceita o CMake 4)
        if: matrix.oldcmake
        run: |
          python -m pip install --quiet "cmake==3.30.5"
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -Append $env:GITHUB_PATH
          & "$scripts/cmake.exe" --version

      - name: Baixar código do OBS ${{ matrix.obs }}
        run: |
          git clone --depth 1 --branch ${{ matrix.obs }} --recursive --shallow-submodules https://github.com/obsproject/obs-studio.git obs

      - name: Colocar o plugin dentro da árvore do OBS
        run: |
          Copy-Item -Recurse plugin obs/plugins/replaydeck
          Remove-Item -Recurse -Force obs/plugins/replaydeck/.git, obs/plugins/replaydeck/app -ErrorAction SilentlyContinue
          $f = "obs/plugins/CMakeLists.txt"
          $c = Get-Content $f -Raw
          if ($c -match 'OBS_CMAKE_VERSION VERSION_GREATER_EQUAL 3\.0\.0') {
            $i = $c.IndexOf("add_subdirectory(aja)")
            $c = $c.Insert($i, "add_subdirectory(replaydeck)`n  ")
          } else {
            $c += "`nadd_subdirectory(replaydeck)`n"
          }
          Set-Content $f $c -NoNewline

      - name: Configurar (baixa Qt e FFmpeg do obs-deps)
        working-directory: obs
        run: cmake --preset windows-x64 -DENABLE_BROWSER=OFF -DENABLE_WEBSOCKET=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DPLUGIN_BUILD=${{ github.run_number }}

      - name: Compilar
        working-directory: obs
        run: cmake --build build_x64 --config RelWithDebInfo --target replaydeck --parallel

      - name: Separar a DLL
        run: |
          $dll = Get-ChildItem -Recurse obs/build_x64 -Filter replaydeck.dll | Select-Object -First 1
          $pdb = Get-ChildItem -Recurse obs/build_x64 -Filter replaydeck.pdb | Select-Object -First 1
          if (-not $dll) { throw "DLL não encontrada" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll.FullName out/
          if ($pdb) { Copy-Item $pdb.FullName out/ }

      - uses: actions/upload-artifact@v7
        with:
          name: win-obs${{ matrix.major }}
          path: out/*

  windows-package:
    needs: windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin

      - uses: actions/download-artifact@v7
        with:
          pattern: win-obs*
          path: builds

      - name: Montar os arquivos
        run: |
          $v = (Select-String -Path plugin/CMakeLists.txt -Pattern 'project\(ReplayDeck VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "RD_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist, pkg-win/bin/64bit, pkg-win/data, zip/replaydeck/bin/64bit, zip/replaydeck/data, pdb | Out-Null

          # Pacote universal (OBS 30.0+)
          Copy-Item "builds/win-obs30/replaydeck.dll" "pkg-win/bin/64bit/"
          Copy-Item -Recurse plugin/data/* "pkg-win/data/"
          if (Test-Path "builds/win-obs30/replaydeck.pdb") {
            Copy-Item "builds/win-obs30/replaydeck.pdb" "pdb/replaydeck.pdb"
          }

          # Zip manual direto
          Copy-Item "builds/win-obs30/replaydeck.dll" "zip/replaydeck/bin/64bit/"
          Copy-Item -Recurse plugin/data/* "zip/replaydeck/data/"
          Copy-Item plugin/installer/README-windows.txt zip/README.txt
          Compress-Archive -Path zip/* -DestinationPath "dist/replaydeck-$v-windows.zip"
          Compress-Archive -Path pdb/* -DestinationPath "dist/replaydeck-$v-windows-simbolos-pdb.zip"

      - name: Instalador
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC não encontrado" }
          $langDir = Join-Path (Split-Path $iscc.FullName) "Languages"
          foreach ($n in @("Korean.isl", "ChineseSimplified.isl")) {
            if (Test-Path "$langDir/$n") { continue }
            foreach ($sub in @("", "Unofficial/")) {
              try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/$sub$n" -OutFile "$langDir/$n" -ErrorAction Stop; break } catch { }
            }
          }
          $src = (Resolve-Path "pkg-win").Path
          & $iscc.FullName "/DMyVersion=$($env:RD_VERSION)" "/DSrcDir=$src" "/O$PWD/inst" plugin/installer/replaydeck.iss
          if ($LASTEXITCODE -ne 0) { throw "falha no instalador" }
          Copy-Item plugin/installer/README-windows.txt inst/README.txt
          Compress-Archive -Path inst/* -DestinationPath "dist/replaydeck-$($env:RD_VERSION)-windows-installer.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  release:
    needs: [windows, windows-package]
    if: needs.windows-package.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: src

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ls -la dist
          V=$(ls dist/*-windows.zip | sed -n 's/.*replaydeck-\(.*\)-windows.zip/\1/p')
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ github.event.inputs.oficial }}" == "true" || "$MSG" == *"[release]"* || "$MSG" == *"[oficial]"* ]]; then
            TAG=v$V
            FILES=$(ls dist/*.zip | grep -v simbolos)
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "ReplayDeck ${TAG#v} (Windows)" \
              --notes-file src/installer/release-notes.md --latest
          else
            echo "build only (no [release] in the commit message): nothing published"
          fi
